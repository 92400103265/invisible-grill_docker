services:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: invisible-grill-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: invisible-grill-backend
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env